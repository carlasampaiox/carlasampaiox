name: CI
on:
  push:
    paths-ignore: ["dados/**"]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Importador e coletor (testes)
        working-directory: importador
        run: |
          pip install "feedparser>=6,<7"
          python -m unittest -v
      - name: Importador (simulação)
        working-directory: importador
        run: python importar_posts.py simular --saida /tmp/saida
      - name: Content Lab (sintaxe e build)
        working-directory: content-lab
        run: |
          node --check app.js
          python build.py --check
      - name: Content Lab (teste de fumaça)
        working-directory: content-lab
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/smoke.cjs
