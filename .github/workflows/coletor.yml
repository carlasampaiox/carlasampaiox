name: Coletor gratuito do Content Lab
# Todo dia às 6h10 (Brasília): YouTube (RSS oficial), Google Notícias (link real e
# trecho da matéria), blogs, seguidores públicos dos concorrentes e Google Trends.
# Sem chaves e sem créditos. O resultado fica em dados/ e a rotina do Claude
# "Coleta gratuita do Content Lab" importa o que for novo às 7h13.
on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coletor
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bibliotecas open source (GitHub)
        run: pip install -r importador/requirements-coletor.txt
      - name: Coletar
        working-directory: importador
        run: python -u coletor.py --saida ../dados --sem-tendencias
      - name: Seguidores e inscritos públicos (se falhar, fica o último número)
        working-directory: importador
        continue-on-error: true
        env:
          PERFIS_DIAGNOSTICO: "1"
        run: timeout 240 python -u perfis.py --fontes fontes.json --saida ../dados
      - name: Google Trends (com prazo; se estourar, segue sem)
        working-directory: importador
        continue-on-error: true
        run: timeout 420 python -u coletor.py --saida ../dados --so-tendencias
      - name: Guardar no repositório
        run: |
          git config user.name "coletor-content-lab"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then echo "Nada novo"; exit 0; fi
          git commit -m "Coleta gratuita $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
